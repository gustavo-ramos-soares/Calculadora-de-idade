
<!DOCTYPE html>

<html lang="pt-br">

<head>
    <title>Calculadora de idade</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="./css/style.css">
    <script src="./js/script.js" defer></script>
</head>

<body>

    <header class="headerTopo">
        
        <div>
            CalculadoraYearsOld.org
        </div>

        <div>
            <button type="button" id="btnTema" class="btnTema" >
                <i class="fa-solid fa-sun"></i>
            </button>
        </div>

    </header>

    <main>

        <div id="calculadora">

            <header class="cabecalho">
                <h1>Calculadora de Idade</h1>
            </header>

            <fieldset>

                <legend>Sua data de nascimento:</legend>

                <div class="campos">

                    <div class="campo">
                        <label for="diaNas">Dia:</label>
                        <input type="number" id="diaNas" min="1" max="31" placeholder="DD">
                    </div>

                    <div class="campo">
                        <label for="mesNas">Mês:</label>
                        <input type="number" id="mesNas" min="1" max="12" placeholder="MM">
                    </div>

                    <div class="campo">
                        <label for="anoNas">Ano:</label>
                        <input type="number" id="anoNas" min="1900" placeholder="AAAA">
                    </div>

                </div>

                <button type="button" id="btnCalcular" class="btnCalcular">
                    Calcular
                </button>

            </fieldset>

        </div>

        <div id="res" class="res"></div>

    </main>

    <footer>
        <p>&copy; Desenvolvido por Gustavo Ramos</p>
    </footer>

</body>

</html>
